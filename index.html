<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SF2: CE Monitor</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    background: #0d0d0d;
    color: #e0e0e0;
    font-family: 'Consolas', 'Courier New', monospace;
    padding: 20px;
    margin: 0;
    overflow: hidden;
  }
  h1 {
    font-size: 16px;
    color: #ffcc00;
    margin: 0 0 24px 0;
    text-align: center;
    letter-spacing: 1px;
  }
  .vs-container {
    padding:20px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    gap: 12px;
    position: absolute;
    left: 0px;
    right: 0px;
    z-index: 10;
  }
  .vs-label {
    font-size: 22px;
    font-weight: bold;
    color: #ffcc00;
    text-shadow: 2px 2px 0 #7a1f1f;
    padding-top: 6px;
  }
  .player {
    display: flex;
    flex-direction: column;
  }
  .label {
    display: flex;
    font-size: 13px;
    font-weight: bold;
    color: #fff;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .p1 .label { justify-content: flex-start; }
  .p2 .label { justify-content: flex-end; }

  .bar-container {
    width: 100%;
    height: 22px;
    background: #8b0000;
    border: 2px solid #000;
    outline: 1px solid #ffcc00;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.6);
    display: flex;
    overflow: hidden;
  }
  .p1 .bar-container { justify-content: flex-end; }
  .p2 .bar-container { justify-content: flex-start; }

  .bar {
    height: 100%;
    background: linear-gradient(180deg, #fff59d 0%, #ffd500 35%, #ffaa00 70%, #ff8800 100%);
    transition: width 0.1s linear;
  }

  .hp-text {
    font-size: 11px;
    color: #999;
    margin-top: 3px;
  }
  .p1 .hp-text { text-align: left; }
  .p2 .hp-text { text-align: right; }

  .hex {
    margin-top: 24px;
    font-size: 12px;
    color: #888;
    text-align: center;
  }
</style>
</head>
<body>
  <!-- <h1>--- SF2: CE (World 920513) ---</h1> -->
<video 
  id="hitVideoP1" 
  src="lighthing.mp4" 
  style="position: absolute; display: none;width:400px;"
  muted
></video>

<video 
  id="hitVideoP2" 
  src="lighthing.mp4" 
  style="position: absolute; display: none;width:400px;"
  muted
></video>
  <div class="vs-container">
    <div class="player p1">
      <div class="label">
        <span>P1</span>
      </div>
      <div class="bar-container">
        <div class="bar" id="p1-bar" style="width: 0%;"></div>
      </div>
      <div class="hp-text" id="p1-text">0 / 144 (0%)</div>
    </div>

    <div class="vs-label">VS</div>

    <div class="player p2">
      <div class="label">
        <span>P2</span>
      </div>
      <div class="bar-container">
        <div class="bar" id="p2-bar" style="width: 0%;"></div>
      </div>
      <div class="hp-text" id="p2-text">0 / 144 (0%)</div>
    </div>
  </div>
<!--
  <div class="hex" id="hex-text">Value HEX: --</div>-->

  <script src="renderer.js"></script>
</body>
</html>
